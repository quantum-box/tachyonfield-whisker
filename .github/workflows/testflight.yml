# Builds the iOS app and uploads it to TestFlight.
# Runs on every merge to main (docs-only changes are skipped), on v* tags,
# and by hand.
#
# Needs, once:
# - `credentials/` committed: run `whisker credential ios` locally (App Store
#   Connect API key wizard). It stores the key age-encrypted in the repo.
# - Repository secret `WHISKER_CREDENTIALS_KEY`: the `AGE-SECRET-KEY-1…`
#   shown when the credentials store was created.
# - Repository secrets `IOS_DEV_CERT_P12` (base64 of a .p12 holding one
#   "Apple Development" certificate and its private key) and
#   `IOS_DEV_CERT_PASSWORD`. Without them Xcode mints a new development
#   certificate on every fresh runner and the account hits Apple's limit.
name: TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload
    # Xcode 26 is needed for Liquid Glass (UIGlassEffect).
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # TestFlight needs a new build number for every upload.
      BUILD_NUMBER: ${{ github.run_number }}
      WHISKER_CREDENTIALS_KEY: ${{ secrets.WHISKER_CREDENTIALS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Whisker CLI
        run: cargo install whisker-cli --version 0.18.0 --locked

      - name: Check credentials
        run: |
          test -n "$WHISKER_CREDENTIALS_KEY" || { echo "::error::Secret WHISKER_CREDENTIALS_KEY is not set"; exit 1; }
          test -f credentials/recipients.txt || { echo "::error::credentials/ is missing; run 'whisker credential ios' locally and commit it"; exit 1; }

      - name: Install signing certificate
        env:
          IOS_DEV_CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          test -n "$IOS_DEV_CERT_P12" || { echo "::error::Secret IOS_DEV_CERT_P12 is not set"; exit 1; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$IOS_DEV_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_DEV_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          # The intermediate that issued the certificate, so it counts as valid.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/wwdr.cer"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"

      - name: Build .ipa
        run: whisker build ipa --no-tui

      - name: Upload to TestFlight
        run: whisker submit ios --no-tui

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
